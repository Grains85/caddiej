name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[test]"

      # The default run. Loopback GSPro/HUD socket tests run here; they use
      # CaddieJ's own fakes and need no external service. Hardware tests
      # (OBS, camera, credentials) self-skip without CADDIEJ_RUN_INTEGRATION.
      - name: Unit and loopback tests
        run: python -m pytest

      # The two things a person does before reading anything, on a machine that
      # has never been configured. Both must work with no .env present.
      - name: Command line
        run: |
          caddiej --version
          caddiej --check-config

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install build
          python -m build

      # Metadata is easy to get wrong and invisible until somebody installs the
      # wheel, so the licence and the entry points are checked here.
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl dist/*.tar.gz
